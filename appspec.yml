
version: 0.0
os: linux

files:
  - source: scripts/
    destination: /opt/ml-app/scripts

permissions:
  - object: /opt/ml-app/scripts/
    pattern: "*.sh"
    owner: root
    group: root
    mode: 755
    type:
      - file

hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 120
      runas: root

  ApplicationStart:
    - location: scripts/deploy_container.sh
      timeout: 600
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 180
      runas: root
